<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121918" />
    <title>页面不存在 — clawsmith</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color: #edf0ea;
        background: #121918;
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        place-items: center;
        background:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          #121918;
        background-size: 36px 36px;
      }

      main {
        width: min(680px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.24);
        padding: clamp(32px, 8vw, 72px);
        background: #121918;
        box-shadow: 12px 12px 0 #ff6038;
      }

      p {
        margin: 0;
        color: #8d9994;
        font-family: "SFMono-Regular", "Roboto Mono", Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0;
        font-family: "Iowan Old Style", "Songti SC", Georgia, serif;
        font-size: clamp(3.6rem, 12vw, 7rem);
        font-weight: 500;
        letter-spacing: -0.07em;
        line-height: 0.9;
      }

      span {
        display: block;
        max-width: 430px;
        color: #bfc7c3;
        line-height: 1.8;
      }

      a {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 18px;
        color: #fff;
        background: #204bff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404 / route not found</p>
      <h1>这里没有代码。</h1>
      <span>请求的页面不存在，或者旧链接已经移动。返回官网继续了解 clawsmith。</span>
      <a href="./">返回首页</a>
    </main>
  </body>
</html>
